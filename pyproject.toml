[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engtrace"
version = "0.1.0"
description = "Industrial requirements intelligence with traceability, cited answers, change impact and guarded approvals."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "EngTrace contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "langgraph==1.2.11",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "pydantic-settings>=2.14.2,<2.16",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.51,<0.53",
]

[project.optional-dependencies]
postgres = [
  "alembic>=1.18.5,<1.20",
  "boto3>=1.43,<2",
  "dramatiq[redis]==2.2.1",
  "pgvector==0.5.0",
  "psycopg[binary]>=3.3,<4",
  "psycopg-pool>=3.3,<3.4",
  "redis>=8.0.1,<8.2",
]
telemetry = [
  "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
]
ml = [
  "sentence-transformers>=5.6,<6.1",
  "transformers>=5.14.1,<5.17",
]
dev = [
  "httpx2>=2.7,<3",
  "pytest>=9.1.1,<9.2",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15.22,<0.17",
]

[project.scripts]
engtrace = "engtrace.main:run"
engtrace-eval = "engtrace.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/engtrace", "apps/worker/engtrace_worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "apps/worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
