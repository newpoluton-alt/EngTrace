apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engtrace
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - engtrace.example.com
      secretName: engtrace-tls
  rules:
    - host: engtrace.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: engtrace-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: engtrace-web
                port:
                  name: http
