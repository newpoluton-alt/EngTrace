apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engtrace-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engtrace-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engtrace-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engtrace-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engtrace-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engtrace-api
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engtrace-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engtrace-web
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
