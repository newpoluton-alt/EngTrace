name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra postgres --extra telemetry
      - name: Lint and format
        run: |
          uv run ruff check apps/api apps/worker
          uv run ruff format --check apps/api apps/worker
      - name: Test with coverage
        run: uv run pytest --cov=engtrace --cov-report=term-missing --cov-fail-under=80
      - name: Run deterministic RAG and security gate
        run: uv run engtrace-eval

  frontend:
    name: TypeScript quality gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  infrastructure:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Check Terraform formatting
        run: >-
          docker run --rm
          -v "${PWD}/infra/terraform:/workspace"
          -w /workspace
          hashicorp/terraform:1.15.8
          fmt -check -recursive
      - name: Build application images
        run: docker compose build api web
