name: engtrace

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: engtrace-api:local
    restart: unless-stopped
    environment:
      ENGTRACE_ENV: development
      ENGTRACE_DATABASE_URL: postgresql+psycopg://engtrace:${POSTGRES_PASSWORD:-engtrace-dev-only}@postgres:5432/engtrace
      ENGTRACE_REDIS_URL: redis://redis:6379/0
      # MinIO is strictly a development/demo substitute. Production uses AWS S3.
      ENGTRACE_S3_ENDPOINT: http://minio:9000
      ENGTRACE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-engtrace}
      ENGTRACE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-engtrace-dev-only}
      ENGTRACE_S3_BUCKET: engtrace-evidence
      ENGTRACE_MODEL_BASE_URL: http://vllm:8000/v1
      ENGTRACE_MODEL_NAME: ${ENGTRACE_MODEL_NAME:-Qwen/Qwen3-8B}
      ENGTRACE_OTEL_ENDPOINT: http://otel-collector:4317
      ENGTRACE_CORS_ORIGINS: '["http://localhost:3000"]'
      OTEL_SERVICE_NAME: engtrace-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development,service.version=0.1.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: engtrace-api:local
    restart: unless-stopped
    command: ["dramatiq", "engtrace_worker.tasks", "--processes", "2", "--threads", "4"]
    environment:
      ENGTRACE_ENV: development
      ENGTRACE_DATABASE_URL: postgresql+psycopg://engtrace:${POSTGRES_PASSWORD:-engtrace-dev-only}@postgres:5432/engtrace
      ENGTRACE_REDIS_URL: redis://redis:6379/0
      ENGTRACE_S3_ENDPOINT: http://minio:9000
      ENGTRACE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-engtrace}
      ENGTRACE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-engtrace-dev-only}
      ENGTRACE_S3_BUCKET: engtrace-evidence
      ENGTRACE_MODEL_BASE_URL: http://vllm:8000/v1
      ENGTRACE_MODEL_NAME: ${ENGTRACE_MODEL_NAME:-Qwen/Qwen3-8B}
      ENGTRACE_OTEL_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: engtrace-worker
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development,service.version=0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - backend
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: engtrace-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: engtrace
      POSTGRES_USER: engtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engtrace-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-engtrace.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engtrace -d engtrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DEVELOPMENT/DEMO ONLY. This archived MinIO release is deliberately pinned to
  # its final maintained security release. AWS S3 is the production object store.
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-engtrace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-engtrace-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
    labels:
      dev.engtrace.scope: demo-only-production-uses-aws-s3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      tempo:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - backend

  tempo:
    image: grafana/tempo:3.0.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-engtrace-dev-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - backend

  # Optional GPU profile: docker compose --profile gpu up --build
  vllm:
    image: vllm/vllm-openai:v0.25.1
    profiles: ["gpu"]
    command:
      - --model
      - ${ENGTRACE_MODEL_NAME:-Qwen/Qwen3-8B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    networks:
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  frontend:
  backend:
    internal: false

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  huggingface-cache:
